<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UberTrends</title>
<style>
:root{--bg:#fafafa;--sf:#fff;--s2:#efeff2;--fg:#101010;--mut:#8a8a93;--bd:#e4e4e8;--ac:#ff3b5c;--acfg:#fff;--lk:#ff3040;--warn:#c2410c;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--sf:#181818;--s2:#262626;--fg:#f3f3f3;--mut:#7d7d86;--bd:#2a2a2a;--ac:#ff4d6d;--warn:#fb923c;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101010;--sf:#181818;--s2:#262626;--fg:#f3f3f3;--mut:#7d7d86;--bd:#2a2a2a;--ac:#ff4d6d;--warn:#fb923c;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.f{fill:currentColor}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:54px;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;max-width:640px;margin:0 auto}
.logo{cursor:pointer;color:var(--fg);display:flex}
.ib{background:none;border:0;padding:8px;border-radius:50%;cursor:pointer;color:var(--mut);position:relative;transition:transform .15s,color .15s}
.ib:active{transform:scale(.88)}
.ib:hover{color:var(--fg)}
.hr{display:flex;justify-content:flex-end}
.dot{position:absolute;top:3px;right:2px;background:var(--lk);color:#fff;font-size:11px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-weight:700;padding:0 4px}
.sb{max-width:640px;margin:0 auto;overflow:hidden;max-height:0;transition:max-height .25s;padding:0 12px}
.sb.open{max-height:60px}
.sb input{margin-bottom:8px}
input[type=search],input[type=text],input[type=email],input[type=password],input[type=date],textarea{background:var(--s2);border:1px solid transparent;border-radius:12px;padding:10px 13px;width:100%}
input:focus-visible,textarea:focus-visible,.btn:focus-visible,.ab:focus-visible,.nb:focus-visible,.ib:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:4px 14px 110px}
#app.enter{animation:pg .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pg{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.post{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.pl{display:flex;flex-direction:column;align-items:center;flex:none}
.ln{flex:1;width:2px;background:var(--bd);margin-top:8px;border-radius:2px}
.avw{position:relative;cursor:pointer}
.plus{position:absolute;right:-4px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);border:2px solid var(--bg);font-weight:700;line-height:1;padding:0;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.plus:active{transform:scale(.8)}
.pr{flex:1;min-width:0}
.ph{display:flex;align-items:center;gap:8px;min-height:24px}
.un{font-weight:700;cursor:pointer}
.mut{color:var(--mut);font-size:14px}
.ph .ib{margin-left:auto;padding:4px}
.pt{margin-top:2px;cursor:pointer;overflow-wrap:anywhere}
.media{margin-top:10px;aspect-ratio:16/10;border-radius:16px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700;cursor:pointer}
.media.lock .mt{filter:blur(7px)}
.pb{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:#0008;display:grid;place-items:center;font-size:20px;transition:transform .2s}
.media:hover .pb{transform:scale(1.12)}
.lockmsg{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:rgba(10,10,10,.62);font-size:13px;text-align:center}
.stamp{width:60px;height:60px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:21px;transform:rotate(-10deg)}
.player{margin-top:10px;aspect-ratio:16/10;border-radius:16px;overflow:hidden;display:grid;place-items:center;color:#fff;text-align:center}
.player video{width:100%;height:100%;background:#000}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--warn);color:var(--warn);font-weight:700}
.acts{display:flex;align-items:center;gap:6px;margin-top:8px;margin-left:-8px}
.ab{background:none;border:0;display:flex;align-items:center;gap:6px;padding:8px;border-radius:99px;cursor:pointer;color:var(--fg);position:relative}
.ab:active{background:var(--s2)}
.ab.on{color:var(--lk)}
.ab.pop .ic{animation:hp .5s}
@keyframes hp{0%{transform:scale(1)}30%{transform:scale(1.6) rotate(-8deg)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.bu{position:absolute;left:19px;top:19px;pointer-events:none}
.bu b{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--lk);transform:rotate(var(--a)) translateY(0);opacity:0;animation:bs .55s ease-out}
.bu b:nth-child(even){background:#ffb700}
@keyframes bs{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-26px) scale(.4)}}
.vw{margin-left:auto}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;object-fit:cover}
.av.lg{width:84px;height:84px;font-size:34px}
.btn{background:var(--s2);border:0;border-radius:12px;padding:9px 16px;cursor:pointer;white-space:nowrap;font-weight:600;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.95)}
.btn.p{background:var(--fg);color:var(--bg)}
.btn.ok{color:var(--ok)}
.btn.no{color:var(--warn)}
.btn.on{background:var(--ac);color:var(--acfg)}
.btn.o{background:none;border:1px solid var(--bd)}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
label{display:block;margin:12px 0 5px;font-weight:600}
label.c{font-weight:400;display:flex;gap:8px;align-items:center}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.empty{color:var(--mut);text-align:center;padding:60px 10px}
a.l{color:var(--ac);cursor:pointer;font-weight:600}
h2{margin:8px 0}
.top2{display:flex;align-items:center;gap:10px;padding:6px 0}
.cm{display:flex;gap:10px;margin:14px 0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.nbw{max-width:640px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.nb{background:none;border:0;padding:10px 16px;border-radius:12px;cursor:pointer;color:var(--mut);transition:transform .15s}
.nb:active{transform:scale(.85)}
.nb[aria-current=true]{color:var(--fg)}
.nb[aria-current=true] .ic{animation:bn .35s}
.nb.pl2{background:var(--s2);color:var(--fg);padding:10px 22px;border-radius:16px}
.nb .av{width:28px;height:28px;font-size:13px}
@keyframes bn{50%{transform:translateY(-5px) scale(1.12)}}
.dr{position:fixed;inset:0;z-index:40;pointer-events:none}
.dbk{position:absolute;inset:0;background:#0008;opacity:0;transition:opacity .25s}
.dr aside{position:absolute;left:0;top:0;bottom:0;width:min(300px,82vw);background:var(--sf);transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 18px;display:flex;flex-direction:column;gap:2px}
.dr.open{pointer-events:auto}.dr.open .dbk{opacity:1}.dr.open aside{transform:none}
.di{background:none;border:0;text-align:left;padding:13px 12px;border-radius:12px;cursor:pointer;font-weight:600;font-size:16px}
.di:hover,.di:active{background:var(--s2)}
.menu{position:fixed;z-index:50;background:var(--sf);border:1px solid var(--bd);border-radius:16px;min-width:210px;padding:6px;box-shadow:0 12px 40px #0006;transform-origin:top right;animation:mn .18s ease-out}
@keyframes mn{from{opacity:0;transform:scale(.85) translateY(-6px)}to{opacity:1;transform:none}}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:500}
.menu button:hover{background:var(--s2)}
.menu .no{color:var(--warn)}
.mdl{position:fixed;inset:0;z-index:60;background:#000d;display:none;place-items:center;padding:16px;flex-direction:column;gap:12px}
.mdl.open{display:flex;animation:pg .25s}
.mdl img{max-width:100%;max-height:78vh;border-radius:12px}
.bn{height:130px;border-radius:0 0 18px 18px;background-size:cover;background-position:center;position:relative;overflow:hidden;margin:0 -14px}
.bn.aurora::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#3de0d066,#ff4d6d66,#7c5cff66,#3de0d066);background-size:300% 100%;animation:au 6s linear infinite}
@keyframes au{to{background-position:300% 0}}
.pav{position:relative;width:84px;height:84px;margin:-42px 0 0 6px}
.pav .av{position:relative;z-index:1;border:3px solid var(--bg)}
.pav.ring::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--ac),#ffb700,#3de0d0,#7c5cff,var(--ac));animation:sp 3s linear infinite}
.pav.pulse .av{animation:pl 1.8s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 var(--ac)}50%{box-shadow:0 0 24px 4px var(--ac)}}
.nm{font-size:22px;font-weight:800;margin:8px 0 2px}
.nm.fxn{background:linear-gradient(90deg,var(--fg),var(--ac),var(--fg));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:au 4s linear infinite}
.stats{display:flex;gap:18px;margin:10px 0}
.msgs{display:flex;flex-direction:column;gap:6px;padding:10px 0;min-height:40vh}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--s2);align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--ac);color:var(--acfg)}
.bub.new{animation:bb .25s ease-out}
@keyframes bb{from{opacity:0;transform:translateY(10px) scale(.92)}}
.comp{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0;display:flex;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .2s;max-width:90%;z-index:70}
#toast.s{opacity:1;transform:translate(-50%,0)}
.nb{padding:10px 12px}.nb.pl2{padding:10px 18px}
.vf{width:15px;height:15px;vertical-align:-2px;margin-left:4px;animation:vg 2.6s ease-in-out infinite}
@keyframes vg{50%{filter:drop-shadow(0 0 5px var(--ac))}}
.vbox{margin-top:10px;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:16/10;background:#000}
.vbox video,.vbox img{width:100%;height:100%;object-fit:contain;display:block}
.vbox img{cursor:zoom-in}
.vbox.demo{background-size:200% 200%!important;animation:dm 5s ease infinite;color:#fff}
@keyframes dm{50%{background-position:100% 100%}}
.mu{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:#0009;border:0;color:#fff;cursor:pointer;z-index:2}
.price{background:var(--ac);color:var(--acfg);font-weight:700;padding:1px 9px;border-radius:99px;font-size:13px}
.pav .plus{width:28px;height:28px;right:-4px;bottom:2px;font-size:17px;z-index:3}
.plus.ok{background:var(--ac);color:#fff}
.plus.pop{animation:pp .55s}
.plus.pop::after{content:"";position:absolute;inset:-2px;border-radius:50%;animation:rp .7s ease-out}
@keyframes pp{0%{transform:scale(.4) rotate(-120deg)}60%{transform:scale(1.4) rotate(12deg)}100%{transform:none}}
@keyframes rp{from{box-shadow:0 0 0 0 var(--ac)}to{box-shadow:0 0 0 24px transparent}}
.wc{border-radius:22px;padding:22px;background:linear-gradient(135deg,var(--ac),#7c5cff);color:#fff;position:relative;overflow:hidden;margin:10px 0}
.wc::before{content:"€";position:absolute;right:-6px;top:-34px;font-size:170px;font-weight:900;opacity:.16;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(14px) rotate(8deg)}}
.bal{font-size:40px;font-weight:800;letter-spacing:-.02em}
.wc.up .bal{animation:bp .7s}
@keyframes bp{40%{transform:scale(1.18)}}
.stp{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px;background:var(--s2);border-radius:14px;margin-top:8px;animation:mn .18s}
.stp[hidden]{display:none}
.stp button{background:none;border:0;font-size:26px;cursor:pointer;border-radius:10px;padding:4px;transition:transform .15s}
.stp button:hover{transform:scale(1.3) rotate(-6deg)}
.stk{font-size:60px;line-height:1.1;display:inline-block;animation:sk 1.8s ease-in-out infinite}
@keyframes sk{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.1)}}
.gif{max-width:200px;max-height:200px;border-radius:12px;margin-top:4px;display:block}
.ban{background:var(--warn);color:#fff;border-radius:12px;padding:8px 12px;font-weight:600}
#app.enter .post{animation:pi .45s both}
#app.enter .post:nth-child(n+2){animation-delay:.06s}#app.enter .post:nth-child(n+3){animation-delay:.12s}#app.enter .post:nth-child(n+4){animation-delay:.18s}
@keyframes pi{from{opacity:0;transform:translateY(14px)}}
:root{--mw:min(92vw,420px)}
header,#app,nav{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sb{transition:max-height .25s,transform .4s cubic-bezier(.2,.8,.2,1)}
body.mo{overflow:hidden}
body.mo header,body.mo #app,body.mo nav,body.mo .sb{transform:translateX(var(--mw))}
.dr aside{width:var(--mw);background:var(--bg);border-radius:0 26px 26px 0;overflow-y:auto;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.dr .dbk{background:#0006}
.dh{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 10px 12px}
.dt{font-size:24px;font-weight:800}
.dcard{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--s2);border-radius:16px;margin:4px 0 10px}
.tls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.tl{background:var(--s2);border:0;border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;cursor:pointer;transition:transform .15s}
.tl:active{transform:scale(.94)}
.dr.open .dh,.dr.open .dcard,.dr.open .tl,.dr.open .di{animation:di .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms + 100ms)}
@keyframes di{from{opacity:0;transform:translateX(-26px)}}
.xi path{stroke-dasharray:1;stroke-dashoffset:1}
.dr.open .xi path{animation:dr .4s .25s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.mi .l1,.mi .l2{transform-box:fill-box;transform-origin:left center;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.ib:active .mi .l2,body.mo .mi .l2{transform:scaleX(1.6)}
.ib:active .mi .l1,body.mo .mi .l1{transform:scaleX(.7)}
.ok{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(8,8,12,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .3s}
.ok.on{opacity:1;pointer-events:auto}
.okb{position:relative;width:156px;height:48px;border-radius:24px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;perspective:260px;box-shadow:0 8px 30px rgba(255,77,109,.5);transition:width .5s cubic-bezier(.3,1.3,.4,1),height .5s cubic-bezier(.3,1.3,.4,1),border-radius .5s,background .4s,box-shadow .5s}
.okb.sq{width:92px;height:92px;border-radius:28px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.okt{transition:opacity .2s}
.okb.sq .okt{opacity:0}
.okb svg{position:absolute;width:52px;height:52px;opacity:0}
.okb.a2 .fid{opacity:1}
.okb.a2 .fid path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .6s ease forwards}
.okb.a3 .rng{opacity:1;animation:ry 1.1s linear infinite}
.okb.a4 .chk{opacity:1;animation:pp2 .5s}
.okb.a4 .chk circle,.okb.a4 .chk path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .5s ease forwards}
.okb.a4 .chk path{animation-delay:.25s}
@keyframes ry{to{transform:rotateY(360deg)}}
@keyframes pp2{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}
.okn{position:absolute;left:0;right:0;top:calc(50% + 76px);text-align:center;color:#fff;font-weight:700;font-size:18px;opacity:0;transform:translateY(10px);transition:all .4s}
.ok.fin .okn{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.pvc{margin-top:10px;padding:10px 12px;background:var(--s2);border-radius:14px;animation:pvi .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pvi{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.tx{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:grid;place-items:center;overflow:hidden}
.tx.on{transform:none}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(70,220,110,.38),transparent 62%);opacity:0;transition:opacity .6s}
.tx.a2 .glow{opacity:1}
.tx.a3 .glow{opacity:.35}
.rc{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;width:min(100%,420px)}
.hero{position:relative;width:132px;height:132px;display:grid;place-items:center;transition:transform .7s cubic-bezier(.3,1.1,.4,1),margin .7s cubic-bezier(.3,1.1,.4,1)}
.tx.a3 .hero{transform:scale(.5);margin:-34px 0}
.orb{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#8cf5a6,#2fc356 58%,#17963c);box-shadow:inset 0 -12px 22px rgba(0,90,30,.35),inset 0 8px 16px rgba(255,255,255,.45),0 12px 40px rgba(40,190,80,.4);display:grid;place-items:center;filter:blur(26px);opacity:0;transform:scale(.4)}
.tx.a1 .orb{opacity:1;transform:scale(1.08);transition:opacity .45s,transform .5s}
.tx.a2 .orb{filter:blur(0);transform:scale(1);transition:filter .5s,transform .5s cubic-bezier(.3,1.5,.5,1)}
.orb svg{width:60px;height:60px}
.txc path{stroke-dasharray:1;stroke-dashoffset:1}
.tx.a2 .txc path{animation:dr .45s .3s ease forwards}
.rp{position:absolute;inset:6px;border-radius:50%;border:6px solid rgba(60,205,95,.45);opacity:0}
.tx.a2 .rp{animation:rpl 1.2s ease-out}
.tx.a2 .rp.r2{animation-delay:.25s}
@keyframes rpl{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(2.3)}}
.txa{font-size:34px;font-weight:800;opacity:0;transform:translateY(8px);transition:all .45s .15s}
.tx.a2 .txa{opacity:1;transform:none}
.txr,.txd{opacity:0;transform:translateY(24px);transition:all .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tx.a3 .txr,.tx.a3 .txd{opacity:1;transform:none;pointer-events:auto}
.txr{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:10px;text-align:center}
.txav{position:relative;margin-bottom:6px}
.txav .av{width:64px;height:64px;font-size:26px}
.txb{position:absolute;right:-4px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#2fc356;color:#fff;border:2px solid var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.txn{font-size:20px;font-weight:800}
.txs{margin-top:10px;background:var(--s2);border-radius:99px;padding:6px 14px;font-size:14px}
.txd{margin-top:16px;width:100%;padding:14px;font-size:17px}
.tls{grid-template-columns:repeat(3,1fr)}
.tl{font-size:12.5px;padding:14px 4px}

var NEWS={items:[],ts:0,busy:0,fail:0};
function newsAgo(d){var n=Math.floor((Date.now()-new Date(d).getTime())/60000);if(n<1)return 'сейчас';if(n<60)return n+' мин назад';var h=Math.floor(n/60);if(h<24)return h+' ч назад';return Math.floor(h/24)+' дн назад'}
function newsImgFromHtml(h){if(!h)return '';var m=String(h).match(/<img[^>]+src=["']([^"']+)["']/i);return m?m[1]:''}
function newsFetch(force){
  if(!force&&NEWS.items.length&&Date.now()-NEWS.ts<9e5)return;
  NEWS.busy=1;NEWS.fail=0;if(view==='home')render();
  var feeds=['https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://lenta.ru/rss/news'),
   'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://feeds.bbci.co.uk/russian/rss.xml'),
   'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://ria.ru/export/rss2/index.xml')];
  (function tryF(i){
    if(i>=feeds.length){NEWS.busy=0;NEWS.fail=1;if(view==='home')render();return}
    fetch(feeds[i]).then(function(r){return r.json()}).then(function(d){
      if(!d||d.status!=='ok'||!d.items||!d.items.length)throw 0;
      NEWS.items=d.items.slice(0,10).map(function(it){return{t:it.title,l:it.link,d:it.pubDate,src:(d.feed&&d.feed.title)||'',img:it.thumbnail||(it.enclosure&&it.enclosure.link)||newsImgFromHtml(it.description)}});
      NEWS.ts=Date.now();NEWS.busy=0;NEWS.fail=0;if(view==='home')render();
    }).catch(function(){tryF(i+1)});
  })(0);
}
function newsCard(){
  if(!NEWS.items.length&&!NEWS.busy&&!NEWS.fail)newsFetch();
  var body;
  if(NEWS.busy&&!NEWS.items.length)body='<div class="mut" style="padding:14px 2px">Загрузка новостей…</div>';
  else if(NEWS.fail&&!NEWS.items.length)body='<div class="mut" style="padding:14px 2px">Не удалось загрузить новости. Проверьте интернет.</div>';
  else body='<div class="nws">'+NEWS.items.map(function(it){return '<a class="nwc" href="'+esc(it.l)+'" target="_blank" rel="noopener">'+(it.img?'<img class="nwi" src="'+esc(it.img)+'" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\')">':'<span class="nwi ph">'+ic('film')+'</span>')+'<b>'+esc(it.t)+'</b><span class="mut">'+(it.src?esc(it.src)+' · ':'')+newsAgo(it.d)+'</span></a>'}).join('')+'</div>';
  return '<div class="nwrap"><div class="nwh"><h2 style="margin:0">Новости</h2><button class="ib" aria-label="Обновить новости" onclick="newsFetch(true)">'+ic('refresh')+'</button></div>'+body+'</div>';
}

async function doAuth(){
  var e=document.getElementById('ae').value.trim().toLowerCase(),p=document.getElementById('ap').value;
  if(!EM.test(e)){toast('Введите правильную почту');return}
  if(p.length<6){toast('Пароль: минимум 6 символов');return}
  var h=await H(e,p),u=user(e);
  if(amode==='reg'){
    var n=document.getElementById('ac').value.trim();
    if(u){toast('Эта почта уже занята');return}
    if(!n){toast('Введите название канала');return}
    S.users.push({e:e,h:h,role:'user',age:'none',ch:{n:n},subs:[],fr:[],rq:[]});S.me=e;save();toast('Аккаунт и канал созданы');go('home');
  }else{
    if(!u||u.h!==h){toast('Неверная почта или пароль');return}
    S.me=e;save();toast('Вы вошли');go('home');
  }
}

function fsz(n){return n>=1048576?(n/1048576).toFixed(1).replace('.',',')+' МБ':Math.max(1,Math.round(n/1024))+' КБ'}
function rd(b,cb){var r=new FileReader();r.onload=function(){cb(r.result)};r.onerror=function(){cb(null)};r.readAsArrayBuffer(b)}
function apkCheck(f,cb){
  rd(f.slice(Math.max(0,f.size-65558)),function(buf){
    if(!buf){cb(null);return}
    var b=new Uint8Array(buf),e=-1;
    for(var i=b.length-22;i>=0;i--){if(b[i]===0x50&&b[i+1]===0x4b&&b[i+2]===5&&b[i+3]===6){e=i;break}}
    if(e<0){cb(null);return}
    var dv=new DataView(buf),cnt=dv.getUint16(e+10,true),sz=dv.getUint32(e+12,true),off=dv.getUint32(e+16,true);
    if(sz>8e6||off+sz>f.size){cb(null);return}
    rd(f.slice(off,off+sz),function(cd){
      if(!cd){cb(null);return}
      var u=new Uint8Array(cd),v=new DataView(cd),p=0,names=[];
      for(var k=0;k<cnt&&p+46<=u.length;k++){
        if(v.getUint32(p,true)!==0x02014b50)break;
        var nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true);
        names.push(new TextDecoder().decode(u.subarray(p+46,p+46+nl)));p+=46+nl+el+cl;
      }
      cb({m:names.indexOf('AndroidManifest.xml')>-1,d:names.some(function(x){return /^classes\d*\.dex$/.test(x)}),n:names.length});
    });
  });
}

   '<div class="kfo"><div style="min-width:0"><b>'+esc(f.t)+'</b><span class="d">'+(f.dir?'Режиссёр: '+esc(f.dir):'&nbsp;')+'</span></div><span class="kpill">'+kMeta(f)+'</span></div><div id="kact">'+kActH(f)+'</div>';
}
function knClr(){KN.tt.forEach(clearTimeout);KN.tt=[]}
function knOpen(){
  var st=kq('kn'),p=kq('ktr'),f=S.films[KN.i];if(!st||!p||!f||KN.open)return;

  ['--tx','--ty','--sx','--sy','--ra'].forEach(function(k){p.style.removeProperty(k)});
  var pr=p.getBoundingClientRect();
  p.style.setProperty('--tx',((cr.left+cr.width/2)-(pr.left+pr.width/2))+'px');
  p.style.setProperty('--ty',((cr.top+cr.height/2)-(pr.top+pr.height/2))+'px');
  p.style.setProperty('--sx',cr.width/pr.width);p.style.setProperty('--sy',cr.height/pr.height);p.style.setProperty('--ra','-28deg');
  void p.offsetWidth;
  p.style.transition='';
  ['--tx','--ty','--sx','--sy','--ra'].forEach(function(k){p.style.removeProperty(k)});
  p.className='ktr vis on';st.classList.add('op');
  KN.tt.push(setTimeout(function(){p.classList.add('in')},380));
  KN.tt.push(setTimeout(function(){var kv=kq('kv');if(kv){kv.classList.add('dk');kv.innerHTML='<div class="ksp"></div>'}},1000));
  KN.tt.push(setTimeout(function(){knMount(f)},1900));
  try{if(navigator.vibrate)navigator.vibrate(10)}catch(e){}
}
function knMount(f){
  var kv=kq('kv');if(!kv||!KN.open)return;
  var src=urls['f'+f.id];
  if(f.yt)kv.innerHTML='<iframe src="https://www.youtube.com/embed/'+f.yt+'?autoplay=1&rel=0&playsinline=1" title="Трейлер" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  else if(src)kv.innerHTML='<video src="'+src+'" controls autoplay playsinline></video>';
  else kv.innerHTML='<img class="knbg" src="'+kPoster(f)+'" alt=""><div class="knno">Трейлер пока не добавлен</div>';
}
function knWatch(){
  var f=S.films[KN.i],kv=kq('kv');if(!f||!kv||kState(f)==='buy')return;
  knClr();var l=kq('klbl');if(l)l.textContent='ФИЛЬМ';
  kv.className='kv dk';var src=urls['m'+f.id];
  kv.innerHTML=src?'<video src="'+src+'" controls autoplay playsinline></video>':'<img class="knbg" src="'+kPoster(f)+'" alt=""><div class="knno">Файл фильма пока не загружен</div>';
}
function knClose(){
  var st=kq('kn'),p=kq('ktr');if(!st||!p||!KN.open)return;
  knClr();document.removeEventListener('pointermove',knTilt);
  var kv=kq('kv');if(kv)kv.innerHTML='';
  p.classList.remove('in');
  var c=st.querySelector('.kc.act'),cr=c.getBoundingClientRect(),pr=p.getBoundingClientRect();
  p.style.setProperty('--tx',((cr.left+cr.width/2)-(pr.left+pr.width/2))+'px');
  p.style.setProperty('--ty',((cr.top+cr.height/2)-(pr.top+pr.height/2))+'px');
  p.style.setProperty('--sx',cr.width/pr.width);p.style.setProperty('--sy',cr.height/pr.height);p.style.setProperty('--ra','24deg');
  p.classList.remove('on');st.classList.remove('op');
  KN.tt.push(setTimeout(function(){
    p.className='ktr';p.innerHTML='';
    ['--tx','--ty','--sx','--sy','--ra','--rx','--ry'].forEach(function(k){p.style.removeProperty(k)});
    KN.open=0;if(KN.auto)knStart();
  },820));
}
function knTilt(e){
  if(KN.raf)return;var cx=e.clientX,cy=e.clientY;
  KN.raf=requestAnimationFrame(function(){KN.raf=0;
    var p=kq('ktr');if(!p||!KN.open||!p.classList.contains('in'))return;
    var r=p.getBoundingClientRect(),x=(cx-r.left)/r.width-.5,y=(cy-r.top)/r.height-.5;
    if(x<-.6||x>.6||y<-.6||y>.6)return;
    p.style.setProperty('--ry',(x*6).toFixed(2)+'deg');p.style.setProperty('--rx',(-y*5).toFixed(2)+'deg')})
}
document.addEventListener('keydown',function(e){
  if(view!=='kino')return;var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(e.key==='Escape'&&KN.open)knClose();
  else if(!KN.open&&e.key==='ArrowRight')knStep(1);
  else if(!KN.open&&e.key==='ArrowLeft')knStep(-1);
});
/* --- публикация: только владелец и менеджеры --- */
function knForm(){if(!isMod()){toast('Публиковать фильмы могут только владелец и менеджеры');return}KN.form=!KN.form;render()}
function knFormH(){
  return '<div class="panel knf"><h3 style="margin-top:0">Новый фильм</h3>'+
   '<label for="kft">Название</label><input type="text" id="kft" maxlength="60">'+
   '<div class="row" style="margin-top:4px"><div style="flex:1;min-width:90px"><label for="kfy">Год</label><input type="text" id="kfy" inputmode="numeric" maxlength="4" placeholder="'+new Date().getFullYear()+'"></div><div style="flex:1;min-width:90px"><label for="kfr">Рейтинг (0–10)</label><input type="text" id="kfr" inputmode="decimal" maxlength="4" placeholder="8.5"></div></div>'+
   '<label for="kfg">Жанр</label><input type="text" id="kfg" maxlength="30" placeholder="Драма">'+
   '<label for="kfd">Режиссёр</label><input type="text" id="kfd" maxlength="50">'+
   '<label for="kfc">Цена, € (0 — бесплатно)</label><input type="text" id="kfc" inputmode="decimal" maxlength="6" placeholder="0">'+
   '<label for="kfp">Постер (картинка)</label><input type="file" id="kfp" accept="image/*">'+
   '<label for="kfl">Трейлер: ссылка на YouTube</label><input type="text" id="kfl" autocapitalize="none" placeholder="https://youtu.be/…">'+

   '<label for="kfm">Файл самого фильма (откроется после покупки)</label><input type="file" id="kfm" accept="video/*">'+
   '<div class="row" style="margin-top:14px"><button class="btn p" onclick="knAdd()">Опубликовать</button><button class="btn" onclick="knForm()">Отмена</button></div></div>';
}
function knListH(){
  var F=S.films;if(!F.length)return '';
  return '<div class="panel"><b>Фильмы в разделе</b>'+F.map(function(f){
    return '<div class="knli"><div class="row" style="flex-wrap:nowrap;min-width:0"><img src="'+kPoster(f)+'" alt=""><div style="min-width:0"><div class="ell"><b>'+esc(f.t)+'</b></div><div class="mut ell">'+kMeta(f)+(f.price?' · '+eur(f.price):' · бесплатно')+(f.demo?' · демо':'')+'</div></div></div><button class="btn no" onclick="knDel(\''+f.id+'\')">Удалить</button></div>';
  }).join('')+'</div>';
}
function kAvg(b,cb){
  var i=new Image(),u=URL.createObjectURL(b);
  i.onload=function(){try{
    var c=document.createElement('canvas');c.width=c.height=12;var x=c.getContext('2d');x.drawImage(i,0,0,12,12);
    var d=x.getImageData(0,0,12,12).data,r=0,g=0,bl=0,n=0;
    for(var k=0;k<d.length;k+=4){r+=d[k];g+=d[k+1];bl+=d[k+2];n++}
    r/=n;g/=n;bl/=n;var mx=Math.max(r,g,bl)||1,f=mx<120?120/mx:1;
    URL.revokeObjectURL(u);cb(Math.min(255,Math.round(r*f))+','+Math.min(255,Math.round(g*f))+','+Math.min(255,Math.round(bl*f)));
  }catch(e){URL.revokeObjectURL(u);cb('90,90,140')}};
  i.onerror=function(){URL.revokeObjectURL(u);cb('90,90,140')};i.src=u;
}
function knAdd(){
  if(!isMod()){toast('Публиковать фильмы могут только владелец и менеджеры');return}
  var t=val('kft'),y=parseInt(val('kfy'),10)||new Date().getFullYear(),g=val('kfg')||'Фильм',d=val('kfd'),
      rs=val('kfr').replace(',','.'),r=rs===''?0:parseFloat(rs),lk=val('kfl'),yt=ytId(lk),
      pf=kq('kfp').files[0],tf=kq('kff').files[0],fl=kq('kfm').files[0],
      pr=Math.round(parseFloat((val('kfc')||'0').replace(',','.'))*100);
  if(!t){toast('Введите название');return}
  if(y<1888||y>2100){toast('Укажите правильный год');return}
  if(isNaN(r)||r<0||r>10){toast('Рейтинг: от 0 до 10');return}
  if(lk&&!yt){toast('Не похоже на ссылку YouTube');return}
  if(isNaN(pr)||pr<0||pr>50000){toast('Цена: от 0 до 500 €');return}
  if(!pf){toast('Выберите постер');return}
  var id='k'+Date.now();toast('Публикация…');
  shrinkB(pf,640,function(b){
    if(!b){toast('Не удалось прочитать постер');return}
    kAvg(b,function(col){
      putMedia('p'+id,b).then(function(){
        var fin=function(){
          if(!isMod())return;
          S.films.push({id:id,t:t,y:y,g:g,r:Math.round(r*10)/10,dir:d,yt:yt||'',col:col,by:S.me,price:pr,buyers:[]});
          if(!save())toast('Фильм опубликован (данные займут много места)');else toast('Фильм опубликован');
          KN.i=S.films.length-1;KN.form=0;render();
        };
        var steps=[];if(tf)steps.push(['f'+id,tf]);if(fl)steps.push(['m'+id,fl]);
        (function nx(i){if(i>=steps.length){fin();return}putMedia(steps[i][0],steps[i][1]).then(function(){nx(i+1)})})(0);
      });
    });
  });
}
function knDel(id){
  if(!isMod()){toast('Удалять фильмы могут только владелец и менеджеры');return}
  var f=S.films.find(function(x){return x.id===id});if(!f)return;
  if(!confirm('Удалить фильм «'+f.t+'»?'))return;
  delMedia('p'+id);delMedia('f'+id);delMedia('m'+id);
  S.films=S.films.filter(function(x){return x.id!==id});save();
  if(KN.i>=S.films.length)KN.i=Math.max(0,S.films.length-1);
  toast('Фильм удалён');render();
}

/* --- покупка фильма: окно оплаты, анимация и звук --- */
function knSheetClose(now){
  var b=kq('kpb'),s=kq('kps');if(!b||!s)return;
  b.removeAttribute('id');s.removeAttribute('id');b.classList.remove('on');s.classList.remove('on');
  var rm=function(){b.remove();s.remove()};if(now===true)rm();else setTimeout(rm,420);
}
function knAsk(id){
  if(!need())return;
  var f=S.films.find(function(x){return x.id===id});if(!f||kState(f)!=='buy')return;
  var u=me(),bal=u.bal||0,ok=bal>=f.price;
  knSheetClose(true);
  var b=document.createElement('div');b.id='kpb';b.className='kpb';b.onclick=function(){knSheetClose()};
  var s=document.createElement('div');s.id='kps';s.className='kps';
  s.innerHTML='<div class="shg"></div>'+
   '<div class="row" style="flex-wrap:nowrap;margin-bottom:6px"><img src="'+kPoster(f)+'" alt="" style="width:52px;height:78px;border-radius:9px;object-fit:cover;flex:none"><div style="min-width:0"><b>'+esc(f.t)+'</b><div class="mut">'+kMeta(f)+'</div></div></div>'+
   '<div class="shr"><span>Фильм</span><b>'+eur(f.price)+'</b></div>'+
   '<div class="shr"><span>Баланс кошелька</span><b>'+eur(bal)+'</b></div>'+
   (ok?'<div class="shr"><span>После оплаты</span><b>'+eur(bal-f.price)+'</b></div><button class="kpay" onclick="knPay(\''+f.id+'\')">Оплатить '+eur(f.price)+'</button>':
       '<div class="mut" style="margin-top:10px">Недостаточно средств на демо-балансе.</div><button class="kpay" onclick="knSheetClose();go(\'wallet\')">Пополнить кошелёк</button>')+
   '<div class="mut" style="margin-top:10px;font-size:12.5px;text-align:center">Демо-оплата из кошелька, это не настоящие деньги</div>';
  document.body.appendChild(b);document.body.appendChild(s);void s.offsetWidth;b.classList.add('on');s.classList.add('on');
}
function payUnlock(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;KN.ac=KN.ac||new A();if(KN.ac.state==='suspended')KN.ac.resume()}catch(e){}}
function payChime(){
  try{
    var c=KN.ac;if(!c)return;if(c.state==='suspended')c.resume();
    var t=c.currentTime+.02;
    [[1568,0,1.0],[2093,.1,1.3]].forEach(function(n){
      var o=c.createOscillator(),h=c.createOscillator(),g=c.createGain(),g2=c.createGain(),a=t+n[1];
      o.type='sine';o.frequency.value=n[0];h.type='sine';h.frequency.value=n[0]*2.76;g2.gain.value=.1;
      h.connect(g2);g2.connect(g);o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(0.0001,a);g.gain.exponentialRampToValueAtTime(.34,a+.01);g.gain.exponentialRampToValueAtTime(.0001,a+n[2]);
      o.start(a);h.start(a);o.stop(a+n[2]+.05);h.stop(a+n[2]+.05);
    });
  }catch(e){}
}
function playPay(f){
  var o=document.getElementById('ok');
  if(!o){o=document.createElement('div');o.id='ok';o.className='ok';o.innerHTML='<div class="okb" id="okb"><span class="okt"></span>'+FID+RNG+CHK+'</div><div class="okn" id="okn"></div>';o.onclick=okEnd;document.body.appendChild(o)}
  okT.forEach(clearTimeout);okT=[];
  var b=document.getElementById('okb'),n=document.getElementById('okn');
  b.className='okb';b.querySelector('.okt').textContent='Оплата';n.textContent='Куплено: '+f.t;
  o.className='ok on';
  [[350,'okb sq'],[800,'okb sq a2'],[1500,'okb sq a3']].forEach(function(s){okT.push(setTimeout(function(){b.className=s[1]},s[0]))});
  okT.push(setTimeout(function(){b.className='okb sq a4';payChime();try{if(navigator.vibrate)navigator.vibrate([18,40,28])}catch(e){}},2200));
  okT.push(setTimeout(function(){o.classList.add('fin')},2800));
  okT.push(setTimeout(okEnd,3900));
}
function knPay(id){
  var f=S.films.find(function(x){return x.id===id}),u=me();
  if(!u||!f||kState(f)!=='buy'){knSheetClose();return}
  if((u.bal||0)<f.price){knSheetClose();toast('Недостаточно средств');go('wallet');return}
  payUnlock();
  u.bal-=f.price;
  var s=user(f.by)||user('santa@official.com');
  if(s&&s.e!==u.e){s.bal=(s.bal||0)+f.price;txAdd(s,'in',f.price,'Продажа фильма: '+f.t+' (@'+unOf(u)+')')}
  txAdd(u,'out',f.price,'Покупка фильма: '+f.t);
  f.buyers=f.buyers||[];f.buyers.push(u.e);save();
  knSheetClose();knRefresh();playPay(f);
}
var _r27=render;render=function(){_r27();if(view==='kino'){knBind();if(KN.auto)knStart()}else knStop()};

loadMedia();
render();
